services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    ports:
      - "6099:6099"
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/data:/app/napcat/data
      - ./napcat/qq:/app/.config/QQ
    environment:
      - ACCOUNT=${QQ_ACCOUNT:-}
      - NAPCAT_GID=0
      - NAPCAT_UID=0

  bot:
    build: .
    container_name: conic-qqbot
    restart: unless-stopped
    depends_on:
      - napcat
    ports:
      - "6060:6060"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ${HOST_HOME:-./host}:/home/host:ro
      - ./.env:/app/.env
      - ./bot.py:/app/bot.py
    environment:
      - TZ=Asia/Shanghai
